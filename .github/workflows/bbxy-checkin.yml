name: BBXY Daily Check-in

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:05 UTC = 09:05 Asia/Shanghai.
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BBXY check-in
        env:
          BBXY_EMAIL: ${{ secrets.BBXY_EMAIL }}
          BBXY_PASSWORD: ${{ secrets.BBXY_PASSWORD }}
        run: python bbxy/checkin.py
